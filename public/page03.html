
<!DOCTYPE html>
<html lang="uk">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>jquery</title>
 <link rel="stylesheet" href="styles.css">
 <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
 <a href="index.html" class="back-link">← Назад на головну</a>
</head>
<body>


<form> 
        <label>Максимум 25 символів:</label><br><br> 
        <textarea id="textarea" placeholder="Введіть ваш текст тут..."></textarea> 
        <div class="counter-text">
            <span id="rchars">25</span> символів залишилося.
        </div>
    </form>

    
<script>	
var maxLength = 25;
// Спрацьовує при введенні кожного нового символу
$('textarea').on('keyup', function() { 
	// Віднімемо від максимальної довжини тексту
	// отриману довжину тексту з поля
	var textlen = maxLength - $(this).val().length; 
	// Вставимо в текстове поле 
	$('#rchars').text(textlen); 
	
	// Відстежуємо кількість символів у полі
	// Якщо більше або дорівнює максимальному значенню, 
	// то обрізаємо рядок від 0 і до максимальної кількості символів
	if($(this).val().length >= maxLength)
		$(this).val($(this).val().substring(0, maxLength));
});
</script>

</body>
</body>
</html>
